name: Branch Policy

# Enforces the branching model described in README.md:
#   - main only accepts pull requests from `dev` (never from feature
#     branches directly).
#   - dev only accepts pull requests from conventionally-named branches
#     (feature/*, feat/*, fix/*, hotfix/*, chore/*, docs/*, refactor/*,
#     test/*, ci/*).
#
# This is set as a required status check on both branches' protection
# rulesets (see .github/rulesets/) - GitHub does not support "only allow
# PRs from branch X" natively in branch protection.
#
# Carried over from apps/inv2sp's source repo (originally the only
# CI-as-code branch-policy enforcement between the two source repos);
# promoted to the monorepo root and extended with the `feat/*` (autocad's
# convention: feat/<NNN>-description) and `ci/*` prefixes.

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches:
      - main
      - dev

permissions:
  contents: read
  pull-requests: read

jobs:
  enforce-branch-policy:
    name: Validate source/target branch
    runs-on: ubuntu-latest-enmax-corp
    steps:
      - name: Check base and head branch combination
        shell: bash
        env:
          # Passed via env, not interpolated directly into the script body -
          # github.head_ref/base_ref are attacker-controllable (a PR author
          # picks their own branch name) and splicing them straight into
          # inline script source is a script-injection vector (found by
          # actionlint).
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          echo "Base branch: $BASE"
          echo "Head branch: $HEAD"

          if [ "$BASE" = "main" ]; then
            if [ "$HEAD" != "dev" ]; then
              echo "::error::Pull requests into 'main' are only allowed from 'dev'. This PR is from '$HEAD'. Target 'dev' instead, then promote dev to main separately."
              exit 1
            fi
            echo "OK: main <- dev"
            exit 0
          fi

          if [ "$BASE" = "dev" ]; then
            case "$HEAD" in
              feature/*|feat/*|fix/*|hotfix/*|chore/*|docs/*|refactor/*|test/*|ci/*)
                echo "OK: dev <- $HEAD"
                exit 0
                ;;
              *)
                echo "::error::Pull requests into 'dev' must come from a conventionally-named branch (feature/*, feat/*, fix/*, hotfix/*, chore/*, docs/*, refactor/*, test/*, ci/*). This PR is from '$HEAD'."
                exit 1
                ;;
            esac
          fi

          echo "::error::Unexpected base branch '$BASE' - this workflow should only trigger on PRs targeting main or dev."
          exit 1
