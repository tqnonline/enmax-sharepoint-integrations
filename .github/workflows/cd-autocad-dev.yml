name: CD - autocad - dev

on:
  push:
    branches: [dev]
    paths:
      - 'apps/autocad/**'
      - '.github/workflows/cd-autocad-dev.yml'
      - '.github/workflows/_rw-autocad-deploy.yml'
      - '.github/actions/**'
  workflow_dispatch:

concurrency:
  group: cd-autocad-dev
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    uses: ./.github/workflows/_rw-autocad-deploy.yml
    permissions:
      contents: read
    with:
      environment-name: dev
      run-integration-tests: true
      push-code-app: true
    secrets: inherit
