name: Feature request (autocad)
description: Propose a new capability or improvement to the autocad app
labels: ["enhancement", "autocad"]
body:
  - type: input
    id: spec_section
    attributes:
      label: PRD / spec section
      description: Which PRD functional requirement (F-xx) or backlog item?
      placeholder: "e.g. F-06, Phase 2 backlog"
    validations:
      required: false
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What capability do you need and why?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How will we know this is done?
    validations:
      required: true
  - type: textarea
    id: out_of_scope
    attributes:
      label: What is explicitly out of scope for this request?
