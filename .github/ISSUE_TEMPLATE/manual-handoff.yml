name: Manual handoff (IT Admin task)
description: Track a manual IT Admin runbook execution (either app)
labels: ["runbook", "manual"]
body:
  - type: input
    id: runbook
    attributes:
      label: Runbook number and name
      placeholder: "e.g. 001 - Entra App Registration"
    validations:
      required: true
  - type: dropdown
    id: app
    attributes:
      label: App
      options: ["autocad", "inv2sp", "shared"]
    validations:
      required: true
  - type: input
    id: spec_section
    attributes:
      label: PRD / ADR section
      placeholder: "e.g. Section 12 / ADR-0033"
    validations:
      required: false
  - type: textarea
    id: description
    attributes:
      label: What needs to be done
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Verification checklist
      description: Steps the IT Admin takes to verify completion.
    validations:
      required: true
  - type: input
    id: runbook_link
    attributes:
      label: Link to runbook
      placeholder: "https://github.com/tqnonline/enmax-sharepoint-integrations/blob/runbooks/runbooks/001-*.md (autocad) or apps/inv2sp/docs/operations/runbook.md (inv2sp)"
