table: enmax_autocadappconfig
natural_key_columns: [key]
rows:
  - key: SharedMailboxAddress
    value: "{{ APP_CONFIG_SHARED_MAILBOX | default('EEC_PwrPlat_Svc@enmax.com') }}"
    value_type: String
    description: Outbound mailbox for Power Automate flows (DEV/UAT uses EEC_PwrPlat_Svc@enmax.com). Send-As on this mailbox. NO-REPLY — email copy must not invite replies.
  - key: DocControlEmailAddress
    value: GWE-DocControl@enmax.com
    value_type: String
    description: Document Control mailbox. Approval emails are sent TO this address; creator-facing checkout/check-in emails CC this address.
  - key: CodeAppBaseUrl
    value: "{{ CODE_APP_BASE_URL | default('https://apps.powerapps.com/play/e/default') }}"
    value_type: String
    description: Base URL of the published Code App (no trailing slash). Used by notification flows for deep links.
  - key: SingleAdminMode
    value: "false"
    value_type: Boolean
    description: When true, only one admin may perform write operations at a time. Dev/UAT leave false.
  - key: ReleaseRequiresReason
    value: "true"
    value_type: Boolean
    description: When true, enmax_acdnReleaseDrawing requires a non-empty Reason (min 10 chars) to release an unused reserved number.
  - key: MaxRecordsPerReservation
    value: "10"
    value_type: Integer
    description: Maximum number of records (drawings or documents) that can be reserved in a single reservation.
  - key: MaxSheetsPerDrawing
    value: "50"
    value_type: Integer
    description: Maximum number of sheets a single Drawing may have.
  - key: DefaultSheetsPerDrawing
    value: "1"
    value_type: Integer
    description: Default sheet count when a new Drawing is created.
  - key: StaleCheckoutMonths
    value: "3,6,12"
    value_type: String
    description: Comma-separated month thresholds for stale-checkout reminder notifications.
  - key: ApproverTeamName
    value: ENMAX AutoCAD Approvers
    value_type: String
    description: Dataverse team name holding the Approver role. Must exist before approvals work.
  - key: AdminTeamName
    value: ENMAX AutoCAD Admins
    value_type: String
    description: Dataverse team name holding the Admin role.
  - key: SharePointSiteUrl
    value: https://enmaxcorp.sharepoint.com/sites/GEN-POC
    value_type: String
    description: DEV/UAT SharePoint site (GEN-POC). Production uses separate Drawings and Documents sites.
  - key: CheckInUploadLibraryUrl
    value: https://enmaxcorp.sharepoint.com/sites/GEN-POC/DropOffLibrary
    value_type: String
    description: DEV/UAT drop-off library for check-in uploads (GEN-POC DropOffLibrary).
  - key: DrawingsDropOffLibraryUrl
    value: https://enmaxcorp.sharepoint.com/sites/GEN-POC/DropOffLibrary
    value_type: String
    description: WS5 - Drawings drop-off (read/write) library base URL. DEV/UAT uses GEN-POC DropOffLibrary.
  - key: DrawingsDestinationLibraryUrl
    value: https://enmaxcorp.sharepoint.com/sites/GEN-POC/GF
    value_type: String
    description: WS5 - Drawings destination (read-only) library base URL. DEV/UAT uses GEN-POC GF library.
  - key: DocumentsDropOffLibraryUrl
    value: https://enmaxcorp.sharepoint.com/sites/GEN-POC/DropOffLibrary
    value_type: String
    description: WS5 - Documents drop-off (read/write) library base URL. DEV/UAT uses GEN-POC DropOffLibrary.
  - key: DocumentsDestinationLibraryUrl
    value: https://enmaxcorp.sharepoint.com/sites/GEN-POC/GF
    value_type: String
    description: WS5 - Documents destination (read-only) library base URL. DEV/UAT uses GEN-POC GF library.
  - key: BusinessUnitName
    value: Enmax AutoCAD
    value_type: String
    description: Dataverse Business Unit that owns the solution records.
  - key: BrandPrimary
    value: "#E1393E"
    value_type: String
    description: Cinnabar red — primary brand colour used in Code App header and CTAs.
  - key: BrandSecondary
    value: "#0F487A"
    value_type: String
    description: Chathams Blue — secondary brand colour.
  - key: BrandAccent
    value: "#F7DB9C"
    value_type: String
    description: Marzipan — accent / highlight colour.
  - key: DefaultTheme
    value: system
    value_type: String
    description: Code App colour scheme default. One of 'light', 'dark', 'system'.
  - key: EnableTelemetry
    value: "true"
    value_type: Boolean
    description: Enable Application Insights telemetry from the Code App.
  - key: MaintenanceBannerTitle
    value: Scheduled Maintenance
    value_type: String
    description: Title shown in the maintenance banner when active. Leave blank to suppress the banner.
  - key: MaintenanceBannerBody
    value: The drawing numbering system is temporarily unavailable. Please try again later.
    value_type: String
    description: Body copy for the maintenance banner. Must NOT invite replies — system uses a no-reply mailbox.
  - key: MaintenanceBannerSeverity
    value: Warning
    value_type: String
    description: Severity level of the maintenance banner. One of Info, Warning, Critical.
  - key: FooterDisclaimer
    value: This system manages official ENMAX engineering drawing numbers. All reservations are subject to review.
    value_type: String
    description: Disclaimer text shown in the Code App footer.
  - key: FooterCopyright
    value: "\xA9 ENMAX Corporation. All rights reserved."
    value_type: String
    description: Copyright line shown in the Code App footer.
  - key: BroadcastFanOutCadenceMinutes
    value: "60"
    value_type: Integer
    description: How often (minutes) the broadcast fan-out Power Automate flow runs.
  - key: GridPageSize
    value: "10"
    value_type: Integer
    description: Number of rows per page in all Code App grids and lists. Increase for power users, decrease for low-bandwidth environments.
  - key: EnableDrawingCheckout
    value: "true"
    value_type: Boolean
    description: When true, Check Out is available for Drawing reservations. Set false to hide/disable checkout for drawings only.
  - key: EnableDrawingCheckIn
    value: "true"
    value_type: Boolean
    description: When true, Check In is available for Drawing reservations. Set false to hide/disable check-in for drawings only.
  - key: EnableProcedureCheckout
    value: "true"
    value_type: Boolean
    description: When true, Check Out is available for Procedure reservations. Set false to hide/disable checkout for procedures only.
  - key: EnableProcedureCheckIn
    value: "true"
    value_type: Boolean
    description: When true, Check In is available for Procedure reservations. Set false to hide/disable check-in for procedures only.
  - key: EnableStandardCheckout
    value: "true"
    value_type: Boolean
    description: When true, Check Out is available for Standard Document reservations. Set false to hide/disable checkout for standard documents only.
  - key: EnableStandardCheckIn
    value: "true"
    value_type: Boolean
    description: When true, Check In is available for Standard Document reservations. Set false to hide/disable check-in for standard documents only.
  - key: RequireCheckOutApproval
    value: "true"
    value_type: Boolean
    description: When true, Check Out is a gated action — a user request creates a checkout in the 'Requested' state and an Approver/Admin must approve it before the drawing is checked out and drop-off upload is enabled. Mandatory per governance; leave true.
  - key: ShowFinalizeButton
    value: "false"
    value_type: Boolean
    description: When true, the Finalize action is shown on the drawing/document actions panel. Hidden by default per requirement #14 — set true per environment to expose it.
  - key: ShowObsoleteButton
    value: "false"
    value_type: Boolean
    description: When true, the Mark Obsolete action is shown on the drawing/document actions panel (Admins only). Hidden by default per requirement #14 — set true per environment to expose it.
