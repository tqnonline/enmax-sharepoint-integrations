  # ---------------------------------------------------------------------------
  # 4. Enmax AutoCAD Read Only
  #    Auditors, compliance reviewers, and temporary observers.
  #    Organisation-wide read on all tables — no write access of any kind.
  #    Not in the original PRD 1:1:1 chain; assigned directly or via a
  #    separate Entra group as needed.
  # ---------------------------------------------------------------------------
  - name: Enmax AutoCAD Read Only
    description: >
      Auditors, compliance reviewers, and temporary observers.
      Organisation-wide read across all tables. No write access.
      Use for external reviews, audit cycles, or support escalations.
      Stacks on Basic User.
    privileges:
      enmax_autocadreservation:    { read: global }
      enmax_autocaddrawing:        { read: global }
      enmax_autocadsheet:          { read: global }
      enmax_autocadcheckout:       { read: global }
      enmax_autocadinappnotification: { read: basic }
