    # DeepLinkBootstrap resolves on boot. Hash routes are not used: the player drops the fragment.
    value: "{{ CODE_APP_BASE_URL | default('https://apps.powerapps.com/play/e/21763ca5-959a-e114-9ce5-f67c2a0dbef0/app/1342b673-23ab-4cdd-b340-dca3aa6dd1a8') }}"
