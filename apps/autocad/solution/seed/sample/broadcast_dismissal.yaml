table: enmax_autocadbroadcastdismissal
natural_key_columns: [name]
# Requires SEED_USER_EMAIL set in .env.local
lookups:
  broadcast: {table: enmax_autocadbroadcast, key: title, source_column: broadcast_title}
  user:       {table: systemuser, key: internalemailaddress, source_column: user_email}
rows:
- name: BDIS-Maintenance-2026-01-20
  broadcast_title: Scheduled Maintenance – ENMAX AutoCAD DM 2026-01-20
  user_email: '{{ SEED_USER_EMAIL | default('''') }}'
  enmax_acdnacknowledged: false
  enmax_acdndismissedon: '2026-01-20T08:00:00Z'

