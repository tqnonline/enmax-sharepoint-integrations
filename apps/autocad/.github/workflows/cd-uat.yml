name: CD - UAT tenant

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  DATAVERSE_GEO: can
  PYTHONUTF8: '1'

jobs:
  deploy-uat:
    runs-on: windows-latest
    environment: uat   # Requires manual approval via GitHub Environments
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/code-app/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install uv
        run: pip install uv
      - name: Install PAC CLI
        run: dotnet tool install --global Microsoft.PowerApps.CLI.Tool
      - name: Install Code App deps
        working-directory: apps/code-app
        run: npm ci
      - name: Build Code App
        working-directory: apps/code-app
        run: npm run build
      - name: Install Python deps
        run: uv pip install -r solution/scripts/requirements.txt --system
      - name: Install deploy package
        run: uv pip install -e solution/scripts --system
      - name: Pack solution
        env:
          DATAVERSE_URL: ${{ secrets.UAT_DATAVERSE_URL }}
          DATAVERSE_CLIENT_ID: ${{ secrets.UAT_SP_CLIENT_ID }}
          DATAVERSE_CLIENT_SECRET: ${{ secrets.UAT_SP_CLIENT_SECRET }}
          DATAVERSE_TENANT_ID: ${{ secrets.UAT_TENANT_ID }}
        run: python -m powerplatform_deploy.cli pack --environment uat
      - name: Authenticate PAC CLI
        shell: pwsh
        env:
          DATAVERSE_URL: ${{ secrets.UAT_DATAVERSE_URL }}
          DATAVERSE_CLIENT_ID: ${{ secrets.UAT_SP_CLIENT_ID }}
          DATAVERSE_CLIENT_SECRET: ${{ secrets.UAT_SP_CLIENT_SECRET }}
          DATAVERSE_TENANT_ID: ${{ secrets.UAT_TENANT_ID }}
        run: pac auth create --url $env:DATAVERSE_URL --applicationId $env:DATAVERSE_CLIENT_ID --clientSecret $env:DATAVERSE_CLIENT_SECRET --tenant $env:DATAVERSE_TENANT_ID
      - name: Import solution
        env:
          DATAVERSE_URL: ${{ secrets.UAT_DATAVERSE_URL }}
          DATAVERSE_CLIENT_ID: ${{ secrets.UAT_SP_CLIENT_ID }}
          DATAVERSE_CLIENT_SECRET: ${{ secrets.UAT_SP_CLIENT_SECRET }}
          DATAVERSE_TENANT_ID: ${{ secrets.UAT_TENANT_ID }}
        run: python -m powerplatform_deploy.cli import --environment uat
      - name: Register plugins & Custom APIs
        shell: pwsh
        env:
          DATAVERSE_URL: ${{ secrets.UAT_DATAVERSE_URL }}
          DATAVERSE_CLIENT_ID: ${{ secrets.UAT_SP_CLIENT_ID }}
          DATAVERSE_CLIENT_SECRET: ${{ secrets.UAT_SP_CLIENT_SECRET }}
          DATAVERSE_TENANT_ID: ${{ secrets.UAT_TENANT_ID }}
        run: Import-Module ./scripts/PowerPlatform.Deploy/PowerPlatform.Deploy.psd1 -Force; Register-PpPlugins -Environment uat
      - name: Patch option set labels
        env:
          DATAVERSE_URL: ${{ secrets.UAT_DATAVERSE_URL }}
          DATAVERSE_CLIENT_ID: ${{ secrets.UAT_SP_CLIENT_ID }}
          DATAVERSE_CLIENT_SECRET: ${{ secrets.UAT_SP_CLIENT_SECRET }}
          DATAVERSE_TENANT_ID: ${{ secrets.UAT_TENANT_ID }}
        run: python -m powerplatform_deploy.cli optionsets --environment uat
      - name: Seed deterministic master data
        env:
          DATAVERSE_URL: ${{ secrets.UAT_DATAVERSE_URL }}
          DATAVERSE_CLIENT_ID: ${{ secrets.UAT_SP_CLIENT_ID }}
          DATAVERSE_CLIENT_SECRET: ${{ secrets.UAT_SP_CLIENT_SECRET }}
          DATAVERSE_TENANT_ID: ${{ secrets.UAT_TENANT_ID }}
        run: python -m powerplatform_deploy.cli seed --environment uat
      - name: Provision security roles
        env:
          DATAVERSE_URL: ${{ secrets.UAT_DATAVERSE_URL }}
          DATAVERSE_CLIENT_ID: ${{ secrets.UAT_SP_CLIENT_ID }}
          DATAVERSE_CLIENT_SECRET: ${{ secrets.UAT_SP_CLIENT_SECRET }}
          DATAVERSE_TENANT_ID: ${{ secrets.UAT_TENANT_ID }}
        run: python -m powerplatform_deploy.cli roles --environment uat
      - name: Publish Code App
        shell: pwsh
        env:
          # Read by PowerPlatform.Deploy module via Get-PpEnvConfig's env-only fast path
          # (no .env file needed in CI). Publish-PpCodeApp writes power.config.json with
          # the full dataSources map and runs npx power-apps push.
          DATAVERSE_URL: ${{ secrets.UAT_DATAVERSE_URL }}
          DATAVERSE_CLIENT_ID: ${{ secrets.UAT_SP_CLIENT_ID }}
          DATAVERSE_CLIENT_SECRET: ${{ secrets.UAT_SP_CLIENT_SECRET }}
          DATAVERSE_TENANT_ID: ${{ secrets.UAT_TENANT_ID }}
          APP_ID: ${{ secrets.UAT_APP_ID }}
          APP_DISPLAY_NAME: ${{ secrets.UAT_APP_DISPLAY_NAME }}
          ENVIRONMENT_ID: ${{ secrets.UAT_POWER_APPS_ENV_ID }}
          # npx power-apps push (invoked by Publish-PpCodeApp) requires SP_* for SP auth.
          SP_CLIENT_ID: ${{ secrets.UAT_SP_CLIENT_ID }}
          SP_CLIENT_SECRET: ${{ secrets.UAT_SP_CLIENT_SECRET }}
          SP_TENANT_ID: ${{ secrets.UAT_TENANT_ID }}
        run: |
          Import-Module ./scripts/PowerPlatform.Deploy/PowerPlatform.Deploy.psd1 -Force
          Publish-PpCodeApp -Environment uat
