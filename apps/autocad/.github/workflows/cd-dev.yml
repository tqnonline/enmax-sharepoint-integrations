name: CD - Dev tenant

on:
  push:
    branches: [dev]
  workflow_dispatch:

env:
  DATAVERSE_GEO: can
  PYTHONUTF8: '1'

jobs:
  deploy-dev:
    runs-on: windows-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install uv
        run: pip install uv
      - name: Install PAC CLI
        run: dotnet tool install --global Microsoft.PowerApps.CLI.Tool
      - name: Install Code App deps
        working-directory: apps/code-app
        run: npm ci
      - name: Build Code App
        working-directory: apps/code-app
        run: npm run build
      - name: Install Python deps
        run: uv pip install -r solution/scripts/requirements.txt --system
      - name: Install deploy package
        run: uv pip install -e solution/scripts --system
      - name: Pack solution
        env:
          DATAVERSE_URL: ${{ secrets.DEV_DATAVERSE_URL }}
          DATAVERSE_CLIENT_ID: ${{ secrets.DEV_SP_CLIENT_ID }}
          DATAVERSE_CLIENT_SECRET: ${{ secrets.DEV_SP_CLIENT_SECRET }}
          DATAVERSE_TENANT_ID: ${{ secrets.DEV_TENANT_ID }}
        run: python -m powerplatform_deploy.cli pack --environment dev
      - name: Authenticate PAC CLI
        shell: pwsh
        env:
          DATAVERSE_URL: ${{ secrets.DEV_DATAVERSE_URL }}
          DATAVERSE_CLIENT_ID: ${{ secrets.DEV_SP_CLIENT_ID }}
          DATAVERSE_CLIENT_SECRET: ${{ secrets.DEV_SP_CLIENT_SECRET }}
          DATAVERSE_TENANT_ID: ${{ secrets.DEV_TENANT_ID }}
        run: pac auth create --url $env:DATAVERSE_URL --applicationId $env:DATAVERSE_CLIENT_ID --clientSecret $env:DATAVERSE_CLIENT_SECRET --tenant $env:DATAVERSE_TENANT_ID
      - name: Import solution
        env:
          DATAVERSE_URL: ${{ secrets.DEV_DATAVERSE_URL }}
          DATAVERSE_CLIENT_ID: ${{ secrets.DEV_SP_CLIENT_ID }}
          DATAVERSE_CLIENT_SECRET: ${{ secrets.DEV_SP_CLIENT_SECRET }}
          DATAVERSE_TENANT_ID: ${{ secrets.DEV_TENANT_ID }}
        run: python -m powerplatform_deploy.cli import --environment dev
      - name: Register plugins & Custom APIs
        shell: pwsh
        env:
          DATAVERSE_URL: ${{ secrets.DEV_DATAVERSE_URL }}
          DATAVERSE_CLIENT_ID: ${{ secrets.DEV_SP_CLIENT_ID }}
          DATAVERSE_CLIENT_SECRET: ${{ secrets.DEV_SP_CLIENT_SECRET }}
          DATAVERSE_TENANT_ID: ${{ secrets.DEV_TENANT_ID }}
        run: Import-Module ./scripts/PowerPlatform.Deploy/PowerPlatform.Deploy.psd1 -Force; Register-PpPlugins -Environment dev
      - name: Patch option set labels
        env:
          DATAVERSE_URL: ${{ secrets.DEV_DATAVERSE_URL }}
          DATAVERSE_CLIENT_ID: ${{ secrets.DEV_SP_CLIENT_ID }}
          DATAVERSE_CLIENT_SECRET: ${{ secrets.DEV_SP_CLIENT_SECRET }}
          DATAVERSE_TENANT_ID: ${{ secrets.DEV_TENANT_ID }}
        run: python -m powerplatform_deploy.cli optionsets --environment dev
      - name: Seed master reference data (idempotent PATCH upserts)
        env:
          DATAVERSE_URL: ${{ secrets.DEV_DATAVERSE_URL }}
          DATAVERSE_CLIENT_ID: ${{ secrets.DEV_SP_CLIENT_ID }}
          DATAVERSE_CLIENT_SECRET: ${{ secrets.DEV_SP_CLIENT_SECRET }}
          DATAVERSE_TENANT_ID: ${{ secrets.DEV_TENANT_ID }}
        run: python -m powerplatform_deploy.cli seed --environment dev --scope master
      - name: Provision security roles
        env:
          DATAVERSE_URL: ${{ secrets.DEV_DATAVERSE_URL }}
          DATAVERSE_CLIENT_ID: ${{ secrets.DEV_SP_CLIENT_ID }}
          DATAVERSE_CLIENT_SECRET: ${{ secrets.DEV_SP_CLIENT_SECRET }}
          DATAVERSE_TENANT_ID: ${{ secrets.DEV_TENANT_ID }}
        run: python -m powerplatform_deploy.cli roles --environment dev
      - name: Publish Code App
        shell: pwsh
        env:
          # Read by PowerPlatform.Deploy module via Get-PpEnvConfig's env-only fast path
          # (no .env file needed in CI). Publish-PpCodeApp writes power.config.json with
          # the full dataSources map and runs npx power-apps push.
          DATAVERSE_URL: ${{ secrets.DEV_DATAVERSE_URL }}
          DATAVERSE_CLIENT_ID: ${{ secrets.DEV_SP_CLIENT_ID }}
          DATAVERSE_CLIENT_SECRET: ${{ secrets.DEV_SP_CLIENT_SECRET }}
          DATAVERSE_TENANT_ID: ${{ secrets.DEV_TENANT_ID }}
          APP_ID: ${{ secrets.DEV_APP_ID }}
          APP_DISPLAY_NAME: ${{ secrets.DEV_APP_DISPLAY_NAME }}
          ENVIRONMENT_ID: ${{ secrets.DEV_POWER_APPS_ENV_ID }}
          # npx power-apps push (invoked by Publish-PpCodeApp) requires SP_* for SP auth.
          SP_CLIENT_ID: ${{ secrets.DEV_SP_CLIENT_ID }}
          SP_CLIENT_SECRET: ${{ secrets.DEV_SP_CLIENT_SECRET }}
          SP_TENANT_ID: ${{ secrets.DEV_TENANT_ID }}
        run: |
          Import-Module ./scripts/PowerPlatform.Deploy/PowerPlatform.Deploy.psd1 -Force
          Publish-PpCodeApp -Environment dev
      # Smoke test removed: the previous step pointed Playwright at the live
      # Power Apps play URL, which requires interactive auth and cannot be hit
      # anonymously by chromium. A proper post-deploy smoke needs playwright
      # storageState with a stored auth session; defer to a later change.
      # Unit tests (vitest) on PRs in build-and-test already cover correctness.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Concurrency integration tests (IssueNumbers)
        working-directory: solution/plugins
        env:
          # The integration tests' SkipIfNoDataverse() reads the short names
          # (ENVIRONMENT_URL / CLIENT_ID / CLIENT_SECRET / TENANT_ID) — the same
          # keys as .env.dev. Provide both the canonical DATAVERSE_* names and
          # the short aliases from the same SPN secrets.
          DATAVERSE_URL: ${{ secrets.DEV_DATAVERSE_URL }}
          DATAVERSE_CLIENT_ID: ${{ secrets.DEV_SP_CLIENT_ID }}
          DATAVERSE_CLIENT_SECRET: ${{ secrets.DEV_SP_CLIENT_SECRET }}
          DATAVERSE_TENANT_ID: ${{ secrets.DEV_TENANT_ID }}
          ENVIRONMENT_URL: ${{ secrets.DEV_DATAVERSE_URL }}
          CLIENT_ID: ${{ secrets.DEV_SP_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.DEV_SP_CLIENT_SECRET }}
          TENANT_ID: ${{ secrets.DEV_TENANT_ID }}
        run: dotnet test IssueNumbers.Tests/IssueNumbers.Tests.csproj --filter "Category=Integration" --configuration Release
