name: CD - Dev tenant

on:
  push:
    branches: [dev]
  workflow_dispatch:

env:
  DATAVERSE_GEO: can
  PYTHONUTF8: '1'

jobs:
  deploy-dev:
    runs-on: windows-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install uv
        run: pip install uv
      - name: Install PAC CLI
        run: dotnet tool install --global Microsoft.PowerApps.CLI.Tool
      - name: Install Code App deps
        working-directory: apps/code-app
        run: npm ci
      - name: Build Code App
        working-directory: apps/code-app
        run: npm run build
      - name: Install Python deps
        run: uv pip install -r solution/scripts/requirements.txt --system
      - name: Install deploy package
        run: uv pip install -e solution/scripts --system
      - name: Pack solution
        env:
          DATAVERSE_URL: ${{ secrets.DEV_DATAVERSE_URL }}
          DATAVERSE_CLIENT_ID: ${{ secrets.DEV_SP_CLIENT_ID }}
          DATAVERSE_CLIENT_SECRET: ${{ secrets.DEV_SP_CLIENT_SECRET }}
          DATAVERSE_TENANT_ID: ${{ secrets.DEV_TENANT_ID }}
        run: python -m powerplatform_deploy.cli pack --environment dev
      - name: Authenticate PAC CLI
        shell: pwsh
        env:
          DATAVERSE_URL: ${{ secrets.DEV_DATAVERSE_URL }}
          DATAVERSE_CLIENT_ID: ${{ secrets.DEV_SP_CLIENT_ID }}
          DATAVERSE_CLIENT_SECRET: ${{ secrets.DEV_SP_CLIENT_SECRET }}
          DATAVERSE_TENANT_ID: ${{ secrets.DEV_TENANT_ID }}
        run: pac auth create --url $env:DATAVERSE_URL --applicationId $env:DATAVERSE_CLIENT_ID --clientSecret $env:DATAVERSE_CLIENT_SECRET --tenant $env:DATAVERSE_TENANT_ID
      - name: Import solution
        env:
          DATAVERSE_URL: ${{ secrets.DEV_DATAVERSE_URL }}
          DATAVERSE_CLIENT_ID: ${{ secrets.DEV_SP_CLIENT_ID }}
          DATAVERSE_CLIENT_SECRET: ${{ secrets.DEV_SP_CLIENT_SECRET }}
          DATAVERSE_TENANT_ID: ${{ secrets.DEV_TENANT_ID }}
        run: python -m powerplatform_deploy.cli import --environment dev
      - name: Register plugins & Custom APIs
        shell: pwsh
        env:
          DATAVERSE_URL: ${{ secrets.DEV_DATAVERSE_URL }}
          DATAVERSE_CLIENT_ID: ${{ secrets.DEV_SP_CLIENT_ID }}
          DATAVERSE_CLIENT_SECRET: ${{ secrets.DEV_SP_CLIENT_SECRET }}
          DATAVERSE_TENANT_ID: ${{ secrets.DEV_TENANT_ID }}
        run: Import-Module ./scripts/PowerPlatform.Deploy/PowerPlatform.Deploy.psd1 -Force; Register-PpPlugins -Environment dev
      - name: Patch option set labels
        env:
          DATAVERSE_URL: ${{ secrets.DEV_DATAVERSE_URL }}
          DATAVERSE_CLIENT_ID: ${{ secrets.DEV_SP_CLIENT_ID }}
          DATAVERSE_CLIENT_SECRET: ${{ secrets.DEV_SP_CLIENT_SECRET }}
          DATAVERSE_TENANT_ID: ${{ secrets.DEV_TENANT_ID }}
        run: python -m powerplatform_deploy.cli optionsets --environment dev
      - name: Seed deterministic master data
        env:
          DATAVERSE_URL: ${{ secrets.DEV_DATAVERSE_URL }}
          DATAVERSE_CLIENT_ID: ${{ secrets.DEV_SP_CLIENT_ID }}
          DATAVERSE_CLIENT_SECRET: ${{ secrets.DEV_SP_CLIENT_SECRET }}
          DATAVERSE_TENANT_ID: ${{ secrets.DEV_TENANT_ID }}
        run: python -m powerplatform_deploy.cli seed --environment dev
      - name: Provision security roles
        env:
          DATAVERSE_URL: ${{ secrets.DEV_DATAVERSE_URL }}
          DATAVERSE_CLIENT_ID: ${{ secrets.DEV_SP_CLIENT_ID }}
          DATAVERSE_CLIENT_SECRET: ${{ secrets.DEV_SP_CLIENT_SECRET }}
          DATAVERSE_TENANT_ID: ${{ secrets.DEV_TENANT_ID }}
        run: python -m powerplatform_deploy.cli roles --environment dev
      - name: Publish Code App
        working-directory: apps/code-app
        env:
          POWER_APPS_ENV_ID: ${{ secrets.DEV_POWER_APPS_ENV_ID }}
          # npx power-apps push (the @microsoft/power-apps CLI) requires service-principal
          # creds for non-interactive auth in CI; without these it errors with
          # "Service Principal environment variables SP_CLIENT_ID, SP_CLIENT_SECRET, and SP_TENANT_ID must be set".
          SP_CLIENT_ID: ${{ secrets.DEV_SP_CLIENT_ID }}
          SP_CLIENT_SECRET: ${{ secrets.DEV_SP_CLIENT_SECRET }}
          SP_TENANT_ID: ${{ secrets.DEV_TENANT_ID }}
        run: npx power-apps push --environment-id "$env:POWER_APPS_ENV_ID"
      - name: Smoke test
        working-directory: apps/code-app
        env:
          SMOKE_URL: ${{ secrets.DEV_APP_PLAY_URL }}
        run: npx playwright test --grep @smoke
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Concurrency integration tests (IssueNumbers)
        working-directory: solution/plugins
        env:
          DATAVERSE_URL: ${{ secrets.DEV_DATAVERSE_URL }}
          DATAVERSE_CLIENT_ID: ${{ secrets.DEV_SP_CLIENT_ID }}
          DATAVERSE_CLIENT_SECRET: ${{ secrets.DEV_SP_CLIENT_SECRET }}
          DATAVERSE_TENANT_ID: ${{ secrets.DEV_TENANT_ID }}
        run: dotnet test IssueNumbers.Tests/IssueNumbers.Tests.csproj --filter "Category=Integration" --configuration Release
