name: Deploy to Production

# Manual, reviewer-gated deployment of INV2SP to production - see
# docs/decisions/0033-github-actions-prod-deployment-spn.md for the full
# design rationale (auth method, trigger mode, scope, and the deliberately
# narrow RBAC scope granted to the deploying service principal).
#
# This pipeline does NOT seed Key Vault secret values
# (fileShareServiceAccountPassword/digestEmailTo/alertEmailTo) -
# Set-KeyVaultSecrets.ps1 stays an interactive, human-run, PIM-elevated
# step by design (a secret value must never pass through CI logs or
# non-interactive automation). Run it manually against prod before or
# after this pipeline's first run.
#
# Runs on the VNET-injected runner (not a public GitHub-hosted runner) per
# the org's "Technology Standards" deployment guide - required for
# reaching prod's private-endpoint-secured resources once
# enableHardening=true, and kept consistent from day one.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type 'deploy' to confirm you want to deploy to PRODUCTION"
        required: true
      whatIfOnly:
        description: 'Preview only - run what-if and stop, do not deploy anything'
        type: boolean
        default: false

permissions:
  contents: read
  id-token: none # this pipeline authenticates with a stored client secret, not OIDC - see ADR-0033

jobs:
  validate-input:
    name: Validate confirmation input
    runs-on: ubuntu-latest-enmax-corp
    steps:
      - name: Require the literal word 'deploy'
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event.inputs.confirm }}" != "deploy" ]; then
            echo "::error::You must type the literal word 'deploy' in the confirm input to run this pipeline against PRODUCTION. Got: '${{ github.event.inputs.confirm }}'"
            exit 1
          fi
          echo "Confirmed."

  plan:
    name: Preview changes (what-if)
    needs: validate-input
    runs-on: ubuntu-latest-enmax-corp
    # Deliberately NOT gated by the production environment - this job must
    # run and produce a visible diff BEFORE a reviewer is asked to approve
    # the apply job below, not after.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (SPN - client ID + secret, see ADR-0033)
        uses: azure/login@v3
        with:
          # azure/login has no separate client-secret input (confirmed
          # against Azure/login's actual action.yml - only client-id,
          # tenant-id, subscription-id, and creds exist). Service-principal-
          # secret auth requires the `creds` input as a single JSON blob;
          # this inlines the 4 separate GitHub secrets into that shape at
          # the point of use (the documented alternative to a single
          # combined AZURE_CREDENTIALS secret - see the Azure/login README's
          # "Login With a Service Principal Secret" section) rather than
          # storing one big JSON secret, matching the 4-separate-secrets
          # request this was built for.
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}'

      - name: Verify required tooling is present on this runner
        shell: bash
        run: |
          set -euo pipefail
          echo "az CLI: $(az version --query '\"azure-cli\"' -o tsv)"
          echo "pwsh:   $(pwsh -Version)"

      - name: What-if preview (infra)
        shell: pwsh
        run: ./scripts/Deploy-Infrastructure.ps1 -Environment prod -WhatIf

  deploy:
    name: Deploy infrastructure + workflows
    needs: plan
    runs-on: ubuntu-latest-enmax-corp
    environment: production # required-reviewer approval gate - see ADR-0033
    if: ${{ github.event.inputs.whatIfOnly != 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (SPN - client ID + secret, see ADR-0033)
        uses: azure/login@v3
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}'

      - name: Deploy infrastructure (Bicep)
        shell: pwsh
        run: ./scripts/Deploy-Infrastructure.ps1 -Environment prod -Force

      - name: Deploy workflows (Logic App zip-deploy)
        shell: pwsh
        run: ./scripts/Deploy-Workflows.ps1 -Environment prod -Force

      - name: Reminder - Key Vault secrets and trigger enablement
        shell: bash
        run: |
          echo "::notice::Deployment complete. Two things this pipeline deliberately does NOT do:"
          echo "::notice:: 1. Seed Key Vault secret values (fileShareServiceAccountPassword/digestEmailTo/alertEmailTo) - run Set-KeyVaultSecrets.ps1 manually if not already done."
          echo "::notice:: 2. Enable the scheduled trigger (SCHEDULED_TRIGGER_ENABLED) - production ships with this OFF by design (ADR-0009). Run Enable-Triggers.ps1 only after independently verifying this deployment."
